apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uxui-viewer-ingress
  namespace: uxui-viewer-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: uxui-viewer.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: uxui-viewer-service
            port:
              number: 80
