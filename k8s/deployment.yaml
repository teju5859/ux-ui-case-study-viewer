apiVersion: apps/v1
kind: Deployment
metadata:
  name: uxui-viewer-deployment
  namespace: uxui-viewer-prod
  labels:
    app: uxui-viewer
    tier: frontend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: uxui-viewer
  template:
    metadata:
      labels:
        app: uxui-viewer
        tier: frontend
    spec:
      containers:
      - name: uxui-viewer
        image: devopsuser/ux-ui-case-study-viewer:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        envFrom:
        - configMapRef:
            name: uxui-viewer-config
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
